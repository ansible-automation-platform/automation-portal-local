# Portal Compose Override
# Usage: podman compose -f compose.yaml -f compose.portal.yaml up -d
#
# APME services are not bundled here. When PORTAL_ONLY!=1, RHDH talks to a
# Gateway started via `make apme` (tox -e up in APME_REPO) at APME_BASE_URL
# (default: http://host.containers.internal:8080).

services:

  # ── Almost like AAP (local mock; no real Controller required) ──
  # Profile "mock": skipped when AAP_MOCK=0 (real AAP controller used).
  aap-mock:
    profiles: ["mock"]
    container_name: aap-mock
    build:
      context: ../aap-mock
    image: localhost/aap-mock:local
    ports:
      - "8099:8099"
    environment:
      PORT: "8099"
      AAP_MOCK_USERNAME: ${AAP_MOCK_USERNAME:-user}
      AAP_MOCK_PASSWORD: ${AAP_MOCK_PASSWORD:-password}
      AAP_PUBLIC_URL: ${AAP_PUBLIC_URL:-http://localhost:8099}
      AAP_TOKEN: ${AAP_TOKEN:-local-mock-token}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-portal-local-mock}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-portal-local-mock-secret}
      # Optional: console Hub offline/refresh token (SSO-exchanged to Bearer access)
      AAP_MOCK_HUB_TOKEN: ${AAP_MOCK_HUB_TOKEN:-}
      AAP_MOCK_HUB_BASE: ${AAP_MOCK_HUB_BASE:-https://console.redhat.com/api/automation-hub}
      AAP_MOCK_HUB_AUTH_URL: ${AAP_MOCK_HUB_AUTH_URL:-https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token}
      AAP_MOCK_HUB_AUTH_CLIENT_ID: ${AAP_MOCK_HUB_AUTH_CLIENT_ID:-cloud-services}
      AAP_MOCK_GALAXY_BASE: ${AAP_MOCK_GALAXY_BASE:-https://galaxy.ansible.com}
      AAP_MOCK_PAH_REPOS: ${AAP_MOCK_PAH_REPOS:-published,validated,rh-certified}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8099/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── PostgreSQL database ──
  db:
    container_name: db
    image: "postgres:16-alpine"
    volumes:
      - portal-pgdata:/var/lib/postgresql/data
    env_file:
      - path: "./default.env"
        required: true
      - path: "./.env"
        required: false
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── RHDH overrides ──
  rhdh:
    environment:
      ENABLE_AUTH_PROVIDER_MODULE_OVERRIDE: 'true'
      APME_BASE_URL: ${APME_BASE_URL:-http://host.containers.internal:8080}
      AAP_PUBLIC_URL: ${AAP_PUBLIC_URL:-http://localhost:8099}
    extra_hosts:
      - "host.containers.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./configs/app-config/app-config.portal.yaml:/opt/app-root/src/configs/app-config/app-config.local.yaml:ro,z
      # SELinux: named volume needs :Z or installer/rhdh get EACCES on /extensions
      - extensions-catalog:/extensions:Z

  install-dynamic-plugins:
    volumes:
      - ./configs/dynamic-plugins/dynamic-plugins.portal.yaml:/opt/app-root/src/configs/dynamic-plugins/dynamic-plugins.override.yaml:ro,z
      - extensions-catalog:/extensions:Z

volumes:
  portal-pgdata:
