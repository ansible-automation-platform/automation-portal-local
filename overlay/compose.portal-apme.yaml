# Portal + APME Compose Override
# Usage: podman compose -f compose.yaml -f compose.portal-apme.yaml up -d
#
# APME images are pulled from ghcr.io/ansible/apme-*
# Set APME_IMAGE_TAG in .env to control the version (default: latest)
#
# On ARM hosts (macOS Apple Silicon), set APME_PLATFORM=linux/amd64 in .env
# to pull amd64 images via emulation. On x86_64 hosts, leave it unset.
#
# APME stack services use compose profile "apme" (enabled by default via
# COMPOSE_PROFILES from scripts/lib.sh). Set APME_EXTERNAL=1 to skip them
# and point RHDH at an already-running Gateway via APME_BASE_URL.

services:

  # ── Almost like AAP (local mock; no real Controller required) ──
  aap-mock:
    container_name: aap-mock
    build:
      context: ../aap-mock
    image: localhost/aap-mock:local
    ports:
      - "8099:8099"
    environment:
      PORT: "8099"
      AAP_MOCK_USERNAME: ${AAP_MOCK_USERNAME:-user}
      AAP_MOCK_PASSWORD: ${AAP_MOCK_PASSWORD:-password}
      AAP_PUBLIC_URL: ${AAP_PUBLIC_URL:-http://localhost:8099}
      AAP_TOKEN: ${AAP_TOKEN:-local-mock-token}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-portal-local-mock}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-portal-local-mock-secret}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8099/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── PostgreSQL database ──
  db:
    container_name: db
    image: "postgres:16-alpine"
    volumes:
      - portal-pgdata:/var/lib/postgresql/data
    env_file:
      - path: "./default.env"
        required: true
      - path: "./.env"
        required: false
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── RHDH overrides ──
  rhdh:
    environment:
      ENABLE_AUTH_PROVIDER_MODULE_OVERRIDE: 'true'
      APME_BASE_URL: ${APME_BASE_URL:-http://apme-gateway:8080}
    extra_hosts:
      - "host.containers.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      aap-mock:
        condition: service_healthy
    volumes:
      - ./configs/app-config/app-config.portal-apme.yaml:/opt/app-root/src/configs/app-config/app-config.local.yaml:ro,z

  install-dynamic-plugins:
    depends_on:
      aap-mock:
        condition: service_healthy
    volumes:
      - ./configs/dynamic-plugins/dynamic-plugins.portal-apme.yaml:/opt/app-root/src/configs/dynamic-plugins/dynamic-plugins.override.yaml:ro,z

  # ── Abbenay AI (Tier 2 remediation + Gateway ADR-070 admin proxy) ──
  # Profile "apme": skipped when APME_EXTERNAL=1 (use host tox -e up Abbenay instead).
  # Unlike the APME pod (shared netns → 127.0.0.1), compose uses a bridge network, so
  # Abbenay binds 0.0.0.0. Ports are NOT published to the host.
  # Provider API keys: copy .env-abbenay.example → .env-abbenay (synced into rhdh-local).
  apme-abbenay:
    profiles: ["apme"]
    image: ghcr.io/redhat-developer/abbenay:${ABBENAY_IMAGE_TAG:-v2026.8.1}
    platform: ${APME_PLATFORM:-}
    container_name: apme-abbenay
    # Use command (not args) — docker-compose schema rejects args on services.
    command:
      - "web"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8787"
      - "--grpc-host"
      - "0.0.0.0"
      - "--grpc-port"
      - "50057"
    env_file:
      - .env-abbenay
    environment:
      APME_ABBENAY_TOKEN: ${APME_ABBENAY_TOKEN:-apme-dev-token}
      ABBENAY_API_TOKEN: ${APME_ABBENAY_TOKEN:-apme-dev-token}
      XDG_RUNTIME_DIR: /tmp/abbenay-run
      XDG_CONFIG_HOME: /home/abbenay/.config
    volumes:
      - ./abbenay-config:/home/abbenay/.config/abbenay:Z

  # ── APME Gateway (REST API + gRPC Reporting) ──
  # Profile "apme": skipped when APME_EXTERNAL=1.
  apme-gateway:
    profiles: ["apme"]
    image: ghcr.io/ansible/apme-gateway:${APME_IMAGE_TAG:-latest}
    platform: ${APME_PLATFORM:-}
    container_name: apme-gateway
    ports:
      - "8080:8080"
    volumes:
      - apme-gateway-data:/data
    environment:
      APME_PRIMARY_ADDRESS: apme-primary:50051
      APME_DB_PATH: /data/apme.db
      APME_GATEWAY_GRPC_LISTEN: 0.0.0.0:50060
      APME_ABBENAY_HTTP_URL: http://apme-abbenay:8787
      APME_ABBENAY_HTTP_TOKEN: ${APME_ABBENAY_TOKEN:-apme-dev-token}
      APME_ABBENAY_TOKEN: ${APME_ABBENAY_TOKEN:-apme-dev-token}
      OPENSSL_CONF: ${OPENSSL_CONF:-}
      OPENSSL_FIPS: "0"
      SSL_CERT_FILE: /etc/pki/tls/certs/ca-bundle.crt
      REQUESTS_CA_BUNDLE: /etc/pki/tls/certs/ca-bundle.crt
    depends_on:
      apme-primary:
        condition: service_started
      apme-abbenay:
        condition: service_started

  # ── APME Engine (Primary orchestrator) ──
  # Validators share this container's network namespace via network_mode (sidecar pattern).
  # All validators communicate via 127.0.0.1 within the shared namespace.
  apme-primary:
    profiles: ["apme"]
    image: ghcr.io/ansible/apme-primary:${APME_IMAGE_TAG:-latest}
    platform: ${APME_PLATFORM:-}
    container_name: apme-primary
    volumes:
      - apme-sessions:/sessions
    environment:
      APME_PRIMARY_LISTEN: "0.0.0.0:50051"
      NATIVE_GRPC_ADDRESS: "127.0.0.1:50055"
      OPA_GRPC_ADDRESS: "127.0.0.1:50054"
      ANSIBLE_GRPC_ADDRESS: "127.0.0.1:50053"
      GITLEAKS_GRPC_ADDRESS: "127.0.0.1:50056"
      COLLECTION_HEALTH_GRPC_ADDRESS: "127.0.0.1:50058"
      DEP_AUDIT_GRPC_ADDRESS: "127.0.0.1:50059"
      APME_GALAXY_PROXY_URL: "http://127.0.0.1:8765"
      APME_REPORTING_ENDPOINT: "apme-gateway:50060"
      APME_ABBENAY_ADDR: apme-abbenay:50057
      APME_ABBENAY_TOKEN: ${APME_ABBENAY_TOKEN:-apme-dev-token}
      APME_AI_MODEL: ${APME_AI_MODEL:-}
      OPENSSL_CONF: ${OPENSSL_CONF:-}
    depends_on:
      apme-abbenay:
        condition: service_started

  # ── APME Validators (share primary's network namespace) ──
  apme-native:
    profiles: ["apme"]
    image: ghcr.io/ansible/apme-native:${APME_IMAGE_TAG:-latest}
    platform: ${APME_PLATFORM:-}
    container_name: apme-native
    network_mode: "service:apme-primary"
    depends_on:
      apme-primary:
        condition: service_started

  apme-opa:
    profiles: ["apme"]
    image: ghcr.io/ansible/apme-opa:${APME_IMAGE_TAG:-latest}
    platform: ${APME_PLATFORM:-}
    container_name: apme-opa
    network_mode: "service:apme-primary"
    depends_on:
      apme-primary:
        condition: service_started

  apme-ansible:
    profiles: ["apme"]
    image: ghcr.io/ansible/apme-ansible:${APME_IMAGE_TAG:-latest}
    platform: ${APME_PLATFORM:-}
    container_name: apme-ansible
    network_mode: "service:apme-primary"
    # Session venvs (read-only) — required for M001–M004 / L058 / L059 introspection.
    # Matches apme containers/podman/pod.yaml ansible volumeMount.
    volumes:
      - apme-sessions:/sessions:ro
    environment:
      OPENSSL_CONF: ${OPENSSL_CONF:-}
    depends_on:
      apme-primary:
        condition: service_started

  apme-gitleaks:
    profiles: ["apme"]
    image: ghcr.io/ansible/apme-gitleaks:${APME_IMAGE_TAG:-latest}
    platform: ${APME_PLATFORM:-}
    container_name: apme-gitleaks
    network_mode: "service:apme-primary"
    depends_on:
      apme-primary:
        condition: service_started

  apme-collection-health:
    profiles: ["apme"]
    image: ghcr.io/ansible/apme-collection-health:${APME_IMAGE_TAG:-latest}
    platform: ${APME_PLATFORM:-}
    container_name: apme-collection-health
    network_mode: "service:apme-primary"
    volumes:
      - apme-sessions:/sessions:ro
    environment:
      OPENSSL_CONF: ${OPENSSL_CONF:-}
    depends_on:
      apme-primary:
        condition: service_started

  apme-dep-audit:
    profiles: ["apme"]
    image: ghcr.io/ansible/apme-dep-audit:${APME_IMAGE_TAG:-latest}
    platform: ${APME_PLATFORM:-}
    container_name: apme-dep-audit
    network_mode: "service:apme-primary"
    volumes:
      - apme-sessions:/sessions:ro
    environment:
      OPENSSL_CONF: ${OPENSSL_CONF:-}
    depends_on:
      apme-primary:
        condition: service_started

  apme-galaxy-proxy:
    profiles: ["apme"]
    image: ghcr.io/ansible/apme-galaxy-proxy:${APME_IMAGE_TAG:-latest}
    platform: ${APME_PLATFORM:-}
    container_name: apme-galaxy-proxy
    network_mode: "service:apme-primary"
    environment:
      OPENSSL_CONF: ${OPENSSL_CONF:-}
    depends_on:
      apme-primary:
        condition: service_started

  # ── APME native SPA (side-by-side with Portal) ──
  # Enabled when compose profile "apme-ui" is active (APME_UI=1 → COMPOSE_PROFILES).
  # Forced off when APME_EXTERNAL=1 (external stack owns its own UI).
  apme-ui:
    profiles: ["apme-ui"]
    image: ghcr.io/ansible/apme-ui:${APME_IMAGE_TAG:-latest}
    platform: ${APME_PLATFORM:-}
    container_name: apme-ui
    ports:
      - "${APME_UI_PORT:-8081}:8081"
    environment:
      # nginx proxies /api/* to the portal stack gateway
      APME_API_BACKEND: http://apme-gateway:8080
    depends_on:
      apme-gateway:
        condition: service_started

volumes:
  portal-pgdata:
  apme-gateway-data:
  apme-sessions:
