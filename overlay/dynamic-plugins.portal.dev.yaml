# Portal dynamic plugins — DEV (RHDH 2.1 / NFS)
# Bind-mount dist-dynamic under local-plugins/portal-dev/ (compose.portal.dev.yaml).
# Aligned with rhdh-local/configs/dynamic-plugins/dynamic-plugins.yaml (RHAAP block).

includes:
  - dynamic-plugins.default.yaml
  - /dynamic-plugins-root/dynamic-plugins.extensions.yaml

plugins:
  - package: >-
      oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth-backend-module-guest-provider:bs_1.52.0__0.2.20
    disabled: false

  - package: ref://backstage-community-plugin-tech-radar
    disabled: false

  - package: ref://backstage-community-plugin-rbac
    disabled: false

  - package: >-
      oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay-backend:bs_1.52.0__1.17.0
    disabled: true

  - package: >-
      oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay:bs_1.52.0__1.37.1
    disabled: true

  - package: ref://backstage-plugin-scaffolder-backend-module-github
    disabled: false

  - package: ref://red-hat-developer-hub-backstage-plugin-catalog-backend-module-extensions
    disabled: false

  - package: ref://red-hat-developer-hub-backstage-plugin-extensions
    disabled: false

  - package: ref://red-hat-developer-hub-backstage-plugin-extensions-backend
    disabled: false
    pluginConfig:
      extensions:
        installation:
          enabled: true
          saveToSingleFile:
            file: /opt/app-root/src/dynamic-plugins-root/dynamic-plugins.extensions.yaml

  - package: ref://red-hat-developer-hub-backstage-plugin-intelligent-assistant
    disabled: false

  - package: ref://red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend
    disabled: false

  - package: ref://red-hat-developer-hub-backstage-plugin-app-auth
    disabled: true

  - package: ./local-plugins/portal-dev/rhaap-app-auth
    disabled: false

  - package: ./local-plugins/portal-dev/auth-backend-module-rhaap-provider
    disabled: false
    pluginConfig: {}

  - package: ./local-plugins/portal-dev/catalog-backend-module-rhaap
    disabled: false

  - package: ./local-plugins/portal-dev/scaffolder-backend-module-backstage-rhaap
    disabled: false
    pluginConfig:
      dynamicPlugins:
        backend:
          ansible.plugin-scaffolder-backend-module-backstage-rhaap:

  - package: ./local-plugins/portal-dev/self-service
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          ansible.plugin-backstage-self-service:
            providerSettings:
              - title: Almost like AAP
                description: Sign in with local mock (user / password)
                provider: ansible.auth.rhaap
            scaffolderFieldExtensions:
              - importName: AAPTokenFieldExtension
              - importName: AAPResourcePickerExtension
              - importName: AdditionalBuildStepsPickerFieldExtension
              - importName: BaseImagePickerFieldExtension
              - importName: CollectionsPickerFieldExtension
              - importName: EEFileNamePickerFieldExtension
              - importName: FileUploadPickerFieldExtension
              - importName: PackagesPickerFieldExtension
              - importName: MCPServersPickerFieldExtension
              - importName: ScmSelectorFieldExtension
              - importName: GitHubRepoUrlFieldExtension
            dynamicRoutes:
              - importName: LandingPage
                path: /
              - importName: SelfServicePage
                path: /self-service
              - importName: TemplatesPage
                path: /self-service/*
                menuItem:
                  importName: TemplatesSidebarItem
              - importName: HistoryPage
                path: /self-service/create/tasks
                menuItem:
                  importName: HistorySidebarItem
              - importName: EEPage
                path: /self-service/ee/*
              - importName: EEPage
                path: /self-service/ee
                menuItem:
                  importName: EEBuilderSidebarItem
              - importName: CollectionsPage
                path: /self-service/collections
                menuItem:
                  importName: CollectionsSidebarItem
              - importName: CollectionsPage
                path: /self-service/collections/*
              - importName: GitRepositoriesPage
                path: /self-service/repositories
                menuItem:
                  importName: GitRepositoriesSidebarItem
              - importName: GitRepositoriesPage
                path: /self-service/repositories/*
            mountPoints:
              - mountPoint: application/listener
                importName: LocationListener
              - mountPoint: application/listener
                importName: AppThemeFixer
              - importName: AAPLogoutButton
                mountPoint: global.header/profile
                config:
                  priority: 100

  - package: ref://backstage-plugin-signals-backend
    disabled: false

  - package: ref://backstage-plugin-signals
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage.plugin-signals: {}

  - package: ref://backstage-plugin-auth-backend-module-github-provider
    disabled: false

  - package: ref://backstage-plugin-auth-backend-module-gitlab-provider
    disabled: false

  - package: ref://backstage-plugin-scaffolder-backend-module-gitlab
    disabled: false

  - package: ./dynamic-plugins/dist/backstage-plugin-techdocs
    disabled: true
  - package: ./dynamic-plugins/dist/backstage-plugin-techdocs-backend-dynamic
    disabled: true
  - package: ./dynamic-plugins/dist/backstage-plugin-techdocs-module-addons-contrib
    disabled: true
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-catalog-backend-module-marketplace-dynamic
    disabled: true
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-quickstart
    disabled: true
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-adoption-insights
    disabled: true
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-dynamic-home-page
    disabled: true
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-marketplace
    disabled: true
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-global-floating-action-button
    disabled: true
  - package: ./dynamic-plugins/dist/backstage-community-plugin-scaffolder-backend-module-quay-dynamic
    disabled: true
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-lightspeed
    disabled: true
  - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-lightspeed-backend-dynamic
    disabled: true
