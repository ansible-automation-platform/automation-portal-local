---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Validate workflow YAML syntax
        run: |
          python3 -c "
          import yaml, sys, pathlib
          errors = 0
          for f in pathlib.Path('.github/workflows').glob('*.yaml'):
              try:
                  yaml.safe_load(f.read_text())
                  print(f'  ✓ {f}')
              except yaml.YAMLError as e:
                  print(f'  ✗ {f}: {e}')
                  errors += 1
          sys.exit(errors)
          "

      - name: Validate compose overlay syntax
        run: |
          python3 -c "
          import yaml, sys
          try:
              yaml.safe_load(open('overlay/compose.portal.yaml'))
              print('  ✓ overlay/compose.portal.yaml')
          except yaml.YAMLError as e:
              print(f'  ✗ {e}')
              sys.exit(1)
          "

      - name: Validate dynamic-plugins YAML syntax
        run: |
          pip install -q pyyaml
          python3 -c "
          import yaml, sys
          errors = 0
          from pathlib import Path
          paths = [
              Path('overlay/dynamic-plugins.portal.yaml'),
              Path('overlay/dynamic-plugins.portal.dev.yaml'),
              Path('overlay/compose.portal.extensions.yaml'),
          ]
          paths += sorted(Path('overlay/catalog-index').rglob('*.yaml'))
          for path in paths:
              try:
                  yaml.safe_load(path.open())
                  print(f'  ✓ {path}')
              except yaml.YAMLError as e:
                  print(f'  ✗ {path}: {e}')
                  errors += 1
          sys.exit(errors)
          "

      - name: DEV vs tarball plugin host-config parity
        run: |
          pip install -q pyyaml
          python3 scripts/check-plugin-config-parity.py

      - name: Extensions overlay generator
        run: |
          pip install -q pyyaml
          python3 scripts/enable-extensions-overlay.py \
            --dest /tmp/dynamic-plugins.portal-extensions.yaml
          python3 -c "
          import yaml
          doc = yaml.safe_load(open('/tmp/dynamic-plugins.portal-extensions.yaml'))
          pkgs = {p['package']: p for p in doc['plugins']}
          fe = './dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-extensions'
          be = './dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-extensions-backend-dynamic'
          cat = './dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-catalog-backend-module-extensions-dynamic'
          assert pkgs[fe]['disabled'] is False, fe
          assert pkgs[be]['disabled'] is False, be
          fe_id = next(iter(pkgs[fe]['pluginConfig']['dynamicPlugins']['frontend']))
          assert fe_id == 'red-hat-developer-hub.backstage-plugin-extensions', fe_id
          assert pkgs[cat]['pluginConfig']['extensions']['directory'] == '/extensions/extra'
          apme = [p for p in doc['plugins'] if 'backstage-apme' in p.get('package','')]
          assert apme and all(p.get('disabled') for p in apme), apme
          assert '/dynamic-plugins-root/dynamic-plugins.extensions.yaml' in doc['includes']
          print('  ✓ extensions overlay keeps APME disabled and enables Extensions')
          "

      - name: Preserve click-install extensions yaml
        run: |
          pip install -q pyyaml
          python3 scripts/ensure-extensions-yaml.py --self-test

      - name: Validate app-config YAML syntax
        run: |
          python3 -c "
          import yaml, sys
          try:
              yaml.safe_load(open('overlay/app-config.portal.yaml'))
              print('  ✓ overlay/app-config.portal.yaml')
          except yaml.YAMLError as e:
              print(f'  ✗ {e}')
              sys.exit(1)
          "

      - name: Shellcheck scripts
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -x -e SC1091 scripts/*.sh scripts/dist/*.sh

  secrets-check:
    name: Secrets check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check for hardcoded secrets
        run: |
          FOUND=0
          # Check for real tokens/passwords (not placeholders or env var refs)
          for f in overlay/*.yaml .env.example README.md; do
            if grep -Pn '(ghp_[a-zA-Z0-9]{36}|glpat-[a-zA-Z0-9-]{20}|password:\s*[a-zA-Z0-9]{8,})' "$f" 2>/dev/null; then
              echo "::error file=${f}::Possible hardcoded secret found"
              FOUND=1
            fi
          done
          # Ensure .env.example only has placeholders or known mock defaults
          if grep -Pn '^[A-Z_]+=(?!<|https?://|quay|latest|postgres|[0-9]+$|/|local-|portal-local|mock|user$|password$)' .env.example | grep -v '^#' | grep -v 'IMAGE'; then
            echo "::error file=.env.example::Non-placeholder value found"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No hardcoded secrets found."

  plugin-refs:
    name: Plugin reference check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Verify plugin tarball references are consistent
        run: |
          echo "Checking that all .tgz references in dynamic-plugins YAML follow the expected naming pattern..."
          YAML="overlay/dynamic-plugins.portal.yaml"
          ERRORS=0
          while IFS= read -r line; do
            tgz=$(echo "$line" | grep -oP '[a-z][\w.-]+-dynamic-[\w.+-]+\.tgz' || true)
            if [ -n "$tgz" ]; then
              echo "  ✓ $tgz"
            fi
          done < "$YAML"
          # Ensure no broken references (empty .tgz filenames)
          if grep -P '\.tgz\s*$' "$YAML" | grep -P '/\.tgz'; then
            echo "::error::Empty tarball filename found in $YAML"
            ERRORS=1
          fi
          exit $ERRORS
